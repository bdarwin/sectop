name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-app.sh

      - name: Package
        run: |
          ./scripts/make-dmg.sh
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Sectop.app/Contents/Info.plist)"
          ditto -c -k --keepParent dist/Sectop.app "dist/Sectop-$VERSION.zip"
          (cd dist && shasum -a 256 Sectop-*.dmg Sectop-*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Sectop
          path: dist/Sectop-*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Sectop-*.dmg dist/Sectop-*.zip dist/SHA256SUMS.txt \
            --title "Sectop $GITHUB_REF_NAME" --generate-notes
